[package]
name = "nixcp"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
futures = "0.3"
nix-compat = { git = "https://github.com/tvlfyi/tvix.git", version = "0.1" }
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["full", "tracing", "parking_lot"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
cxx = "1.0"
console-subscriber = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.10"
object_store = { version = "0.12", features = ["aws"] }
ulid = "1.2"
tracing-subscriber = "0.3"
humansize = "2.1"
axum = { git = "https://github.com/cything/axum.git", branch = "v0.8.x" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "runtime-tokio-native-tls",
  "macros",
] }
time = "0.3"
sea-orm-migration = "1.1"
rpassword = "7.4"
rand = "0.9"
argon2 = "0.5"
humantime = "2.2"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.19"
